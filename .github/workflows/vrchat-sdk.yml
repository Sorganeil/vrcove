name: VRChat SDK

on:
  push:
    paths:
      ['vrchat/**', 'internal/server/**', 'companion/**/*.go', 'app/**', '.github/workflows/vrchat-sdk.yml']
  pull_request:
    paths:
      ['vrchat/**', 'internal/server/**', 'companion/**/*.go', 'app/**', '.github/workflows/vrchat-sdk.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vrchat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: vrchat/go.mod
          cache-dependency-path: |
            vrchat/go.sum
            go.sum
            companion/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Set up generator tools
        run: |
          python3 -m venv "$RUNNER_TEMP/vrchat-sdk-tools"
          "$RUNNER_TEMP/vrchat-sdk-tools/bin/pip" install -r tools/requirements.txt
      - name: Test generator and source formatting
        run: |
          "$RUNNER_TEMP/vrchat-sdk-tools/bin/python" -m unittest discover -s tools -p test_generate.py
          "$RUNNER_TEMP/vrchat-sdk-tools/bin/black" --check tools
          test -z "$(gofmt -l .)"
      - name: Check reproducible endpoint generation
        run: |
          git init "$RUNNER_TEMP/vrchat-spec"
          git -C "$RUNNER_TEMP/vrchat-spec" remote add origin https://github.com/vrchatapi/specification.git
          git -C "$RUNNER_TEMP/vrchat-spec" fetch --depth 1 origin 3656fce60438134a94f9cb9fff98608aacb250c9
          git -C "$RUNNER_TEMP/vrchat-spec" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vrchat-sdk-tools/bin/python" tools/generate.py --spec-dir "$RUNNER_TEMP/vrchat-spec"
          git diff --exit-code -- endpoints_generated.go models_generated.go coverage.json
      - name: Check application VRChat boundary
        run: go -C .. test ./internal/server -run '^TestVRChatRequestsUseSDK$' -count=1
